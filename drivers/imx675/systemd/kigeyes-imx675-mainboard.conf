[Service]
# Physical port 0 is TCA channel 7 and feeds MIPI0/A. Physical port 3 is
# TCA channel 0 and feeds MIPI1/B. These are libcamera's stable OF camera IDs.
Environment=CAM0=/base/axi/pcie@1000120000/rp1/i2c@88000/i2c-mux@70/i2c@7/camera@1a
Environment=CAM1=/base/axi/pcie@1000120000/rp1/i2c@88000/i2c-mux@70/i2c@0/camera@1a
# XHS/XVS are physically shared on the mainboard; do not repeat an old eye.
Environment=STEREO_REQUIRE_BOTH_NEW=true
